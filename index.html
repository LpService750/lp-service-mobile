function tx(store,mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(store,mode),s=t.objectStore(store),r=fn(s);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}const all=s=>tx(s,'readonly',x=>x.getAll()),get=(s,id)=>tx(s,'readonly',x=>x.get(id)),put=(s,data)=>tx(s,'readwrite',x=>x.put(data)),del=(s,id)=>tx(s,'readwrite',x=>x.delete(id));const field=(label,name,value='',type='text',attrs='')=>`<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${attrs}>`;const area=(label,name,value='')=>`<label>${label}</label><textarea name="${name}">${esc(value)}</textarea>`;const choose=(label,name,items,value='',required=false)=>`<label>${label}</label><select name="${name}" ${required?'required':''}><option value="">Seleccionar...</option>${items.map(x=>`<option value="${esc(x.id??x)}" ${(x.id??x)==value?'selected':''}>${esc(x.name??x)}</option>`).join('')}</select>`;const button=(title,onclick='')=>`<button class="btn" ${onclick?`onclick="${onclick}"`:''}>${title}</button>`;const searchbox=()=>`<input class="search" placeholder="Buscar..." value="${esc(query)}" onchange="query=this.value;render()">`;function toast(t){const x=document.querySelector('#toast');x.textContent=t;x.style.display='block';clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>x.style.display='none',2600)}

function timerSeconds(t,now=Date.now()){
 if(!t)return 0;
 const elapsed=Number(t.elapsedMs)||0;
 return Math.max(0,Math.floor((elapsed+(t.running&&t.startedAt?Math.max(0,now-new Date(t.startedAt).getTime()):0))/1000));
}
function timerFormat(sec){const hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;return [hh,mm,ss].map(x=>String(x).padStart(2,'0')).join(':')}
function timerPanel(o){const t=o.timer||null;return `<section class="timer-box"><b>Cronómetro de jornada</b><p class="timer-caption">Funciona con la hora del iPhone y conserva el tiempo al cerrar o abrir la app. No cuenta las pausas.</p><div class="timer-clock" id="timerClock">${timerFormat(timerSeconds(t))}</div><div class="timer-caption">${t?(t.running?'En marcha desde '+new Date(t.startedAt).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'Pausado'):'Sin jornada cronometrada'}</div><div class="timer-buttons" style="margin-top:12px">${!t?`<button class="btn" onclick="timerAction('${o.id}','start')">▶ Iniciar</button>`:t.running?`<button class="btn secondary" onclick="timerAction('${o.id}','pause')">Ⅱ Pausar</button>`:`<button class="btn" onclick="timerAction('${o.id}','resume')">▶ Reanudar</button>`}${t?`<button class="btn" onclick="timerAction('${o.id}','finish')">✓ Guardar jornada</button><button class="btn danger" onclick="timerAction('${o.id}','discard')">Descartar</button>`:''}</div><p class="tiny">Al guardar se creará una jornada de trabajo, con horas efectivas y descripción. No se suman automáticamente horas a la cotización.</p></section>`}
async function timerAction(id,action){
 const o=await get('orders',id);if(!o)return;
 const now=new Date().toISOString();let t=o.timer||null;
 if(action==='start'){if(t)return; t={id:uid(),date:today(),startedAt:now,elapsedMs:0,running:true}}
 if(action==='pause'){if(!t||!t.running)return;t.elapsedMs=(Number(t.elapsedMs)||0)+Math.max(0,Date.now()-new Date(t.startedAt).getTime());t.running=false;t.startedAt=null}
 if(action==='resume'){if(!t||t.running)return;t.startedAt=now;t.running=true}
 if(action==='discard'){if(!t||!confirm('¿Descartar el tiempo registrado? Esta acción no se puede deshacer.'))return;t=null}
 if(action==='finish'){
   if(!t)return;
   const sec=timerSeconds(t);
   if(sec<1){alert('Aún no se ha registrado tiempo.');return}
   if(sec>86400){alert('El tiempo acumulado supera 24 horas. Pausa y registra la jornada manualmente con las horas correspondientes.');return}
   const description=prompt('Describe los trabajos realizados durante esta jornada:');
   if(description===null)return;
   if(!description.trim()){alert('Debes describir el trabajo para guardar la jornada.');return}
   const date=t.date||today(),hours=Math.round(sec/36)/100;
   o.workDays=[...(o.workDays||[]),{id:uid(),date,kind:'Reparación',startTime:'',endTime:'',hours:String(hours),description:description.trim(),pending:'',timerSeconds:sec}];
   t=null;
 }
 o.timer=t;
 o.updated=now;
 await put('orders',o);
 detailTab='jornadas';render();
 toast(action==='finish'?'Tiempo guardado como jornada':'Cronómetro actualizado');
}

otes)}${area('Observaciones / recomendaciones','notes',x.notes)}<fieldset><legend>Servicio en terreno</legend><div class="two">${field('Kilómetros recorridos','km',x.km||0,'number','min="0" step="0.1"')}${field('Costo real de traslado ($)','travelCost',x.travelCost||0,'number','min="0"')}</div><div class="two">${field('Viáticos ($)','perDiem',x.perDiem||0,'number','min="0"')}${field('Otros gastos ($)','otherCost',x.otherCost||0,'number','min="0"')}</div></fieldset><fieldset><legend>Presupuesto</legend>${field('Mano de obra cotizada ($ neto)','laborQuote',x.laborQuote||0,'number','min="0"')}${field('Costo real de mano de obra ($)','laborCost',x.laborCost||0,'number','min="0"')}${field('Otros cargos al cliente ($ neto)','extraQuote',x.extraQuote||0,'number','min="0"')}<div class="notice"><b>Traslado y viáticos en la cotización</b><p style="margin-top:6px">Activa esta opción para cobrar los mismos importes registrados en «Servicio en terreno». También puedes desactivarla e indicar montos diferentes.</p><label style="display:flex;align-items:center;gap:10px;font-size:13px;color:#263748"><input type="checkbox" name="autoQuoteCosts" style="width:22px;height:22px;flex:none" ${(x.autoQuoteCosts==='yes'||(x.autoQuoteCosts===undefined&&!(Number(x.travelQuote||0)||Number(x.perDiemQuote||0))))?'checked':''} onchange="syncQuotedCosts(this.form)">Usar traslado y viáticos de la faena en la cotización</label></div><div class="two">${field('Traslado a cobrar ($ neto)','travelQuote',x.autoQuoteCosts==='yes'||(x.autoQuoteCosts===undefined&&!(Number(x.travelQuote||0)||Number(x.perDiemQuote||0)))?x.travelCost||0:x.travelQuote??0,'number','min="0" step="1"')}${field('Viáticos a cobrar ($ neto)','perDiemQuote',x.autoQuoteCosts==='yes'||(x.autoQuoteCosts===undefined&&!(Number(x.travelQuote||0)||Number(x.perDiemQuote||0)))?x.perDiem||0:x.perDiemQuote??0,'number','min="0" step="1"')}</div><p class="tiny">Los montos cotizados se suman a la cotización y al saldo del cliente. Son independientes de los costos reales de traslado y viáticos registrados en «Servicio en terreno».</p><label><input type="checkbox" name="iva" ${x.iva!==false?'checked':''} style="display:inline;width:auto"> Aplicar IVA 19% a esta cotización</label></fieldset><button class="btn full">Guardar orden</button></form><p class="tiny">Primero registra el cliente. Después podrás añadir repuestos, actividades, fotografías y pagos a la orden.</p>`}
async function orderView(){const o=await get('orders',detail);if(!o)return'<p>Orden no encontrada.</p>';const [ps,pm]=await Promise.all([all('payments'),all('machines')]);const payments=ps.filter(x=>x.orderId===o.id);const parts=o.parts||[],acts=o.activities||[],photos=o.photos||[],expenses=o.expenses||[];const net=Number(o.laborQuote||0)+Number(o.extraQuote||0)+billedTravel(o)+billedPerDiem(o)+parts.reduce((n,p)=>n+Number(p.qty||0)*Number(p.sale||0),0),total=Math.round(net*(o.iva===false?1:1.19));const paid=payments.reduce((n,p)=>n+Number(p.amount||0),0);const cost=Number(o.travelCost||0)+Number(o.perDiem||0)+Number(o.otherCost||0)+Number(o.laborCost||0)+parts.reduce((n,p)=>n+Number(p.qty||0)*Number(p.cost||0),0)+expenses.reduce((n,e)=>n+Number(e.amount||0),0);return `<div class="topline"><div><small>ORDEN ${esc(o.number)}</small><h2>${esc(o.title)}</h2></div><button class="btn secondary small" onclick="go('orderform','${o.id}')">Editar</button></div><div class="row wrap" style="margin-bottom:12px">${pill(o.status)}<small>${fmt(o.date)} · ${esc(o.location)}</small></div>${(o.workDays||[]).length?`<div class="notice">Jornadas: <b>${workDaySummary(o).count} días</b> · ${workDaySummary(o).hours.toLocaleString('es-CL')} horas · Última jornada: ${fmt(workDaySummary(o).last)}</div>`:''}<div class="panel"><div class="machine-line">${machineIcon(pm.find(m=>m.id===o.machineId)||{type:o.machineType||o.machineLabel,iconOverride:o.machineIconOverride})}<div class="machine-text"><b>${esc(o.machineLabel||'Sin maquinaria')}</b><div class="meta">${esc(o.clientName)} · Horómetro ${esc(o.hours||'—')} h</div></div></div><div class="tabs">${[['datos','Detalles'],['repuestos','Repuestos'],['actividades','Trabajos'],['jornadas','Jornadas'],['fotos','Fotos'],['firmas','Firmas'],['gastos','Gastos'],['pagos','Pagos'],['documentos','PDF']].map(([id,t])=>`<button class="${detailTab===id?'active':''}" onclick="detailTab='${id}';render()">${t}</button>`).join('')}</div>${detailTab==='datos'?`< an></div><small>${esc(p.qty)} × ${money(p.sale)} · Costo ${money(p.cost)}<br>N° parte: ${esc(p.code||'—')} · ${esc(p.status)}<br>Proveedor: ${esc(p.supplier||'Sin registrar')} · Pedido ${fmt(p.orderedAt)} · Recepción ${fmt(p.receivedAt)}<br>${p.tracking?'Seguimiento: '+esc(p.tracking)+' · ':''}${p.invoice?'Comprobante: '+esc(p.invoice):''}</small></div>`).join('')||'<p>Sin repuestos registrados.</p>'}`:''}${detailTab==='actividades'?`<div class="notice"><b>Listado del informe técnico:</b><p style="white-space:pre-wrap">${esc(o.workDoneList||'Sin listado general registrado.')}</p>${button('Editar listado',`go('orderform','${o.id}')`)}</div>${button('+ Actividad',`go('activityform','${o.id}')`)}${acts.map((v,i)=>`<div class="item" style="margin-top:10px"><div class="row"><b>${fmt(v.date)} · ${esc(v.hours)} h · ${esc(v.kind||'Actividad')}</b><button class="btn danger small" onclick="removeEmbedded('${o.id}','activities',${i})">Quitar</button></div><p>${esc(v.description)}</p></div>`).join('')||'<p>Aún no se registran trabajos.</p>'}`:''}${detailTab==='jornadas'?`<div class="notice"><b>Trabajo en varios días</b><p>Registra cada visita a la faena por separado. Puedes dejar la orden en ejecución, esperando repuestos o cualquier estado hasta terminar.</p></div><div class="statline"><span>Días registrados</span><strong>${workDaySummary(o).count}</strong></div><div class="statline"><span>Horas efectivas acumuladas</span><strong>${workDaySummary(o).hours.toLocaleString('es-CL')} h</strong></div>${timerPanel(o)}${button('+ Agregar día',`editDayIndex=-1;go('dayform','${o.id}')`)}${(o.workDays||[]).map((d,i)=>({...d,i})).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(d=>`<div class="item" style="margin-top:10px"><div class="row wrap"><b>${fmt(d.date)} · ${esc(d.hours||0)} h</b><div><button class="btn secondary small" onclick="editDay('${o.id}',${d.i})">Editar</button> <button class="btn danger small" onclick="removeDay('${o.id}',${d.i})">Quitar</button></div></div><small>${esc(d.kind||'Trabajo')} · ${esc(d.startTime||'—')} a ${esc(d.endTime||'—')}</small><p style="white-space:pre-wrap">${esc(d.description)}</p>${d.pending?`<p class="mini"><b>Pendientes:</b> ${esc(d.pending)}</p>`:''}<div class="row wrap"><small>Fotografías: ${photos.filter(p=>p.workDayId===(d.id||'legacy-'+d.i)).length}</small><button class="btn secondary small" onclick="pendingPhotoDay='${d.id||'legacy-'+d.i}';go('photoform','${o.id}')">+ Foto</button></div></div>`).join('')||'<p class="tiny">Todavía no hay jornadas registradas. Agrega el primer día de trabajo.</p>'}`:''}${detailTab==='fotos'?`${button('+ Fotografía',`go('photoform','${o.id}')`)}<div class="photo-list">${photos.map((v,i)=>`<div class="photo-card"><img src="${v.src}" alt="Fotografía ${esc(v.label)}"><small><b>${esc(v.label||'Foto')}</b> · ${fmt(v.date)}</small><small>${esc(v.description||'')}</small><small>${v.workDayId?'Asociada a jornada':'General de la orden'}</small><button class="btn danger small" onclick="removePhoto('${o.id}',${i})">Quitar</button></div>`).join('')}</div>${photos.length?'':'<p>No hay fotografías.</p>'}`:''}${detailTab==='firmas'?`${button('+ Firma del cliente',`go('signatureform','${o.id}')`)}<div class="notice" style="margin-top:12px">Las firmas quedan asociadas a esta orden y se incorporan en la cotización o acta de entrega según corresponda.</div>${(o.signatures||[]).map((sg,i)=>`<div class="item"><b>${esc(sg.purpose||'Firma')}</b><small style="display:block">${esc(sg.signer)} · ${fmt(sg.date)}</small><img class="signature-preview" src="${sg.image}" alt="Firma capturada"><p class="mini">${esc(sg.notes||'')}</p><button class="btn danger small" onclick="removeSignature('${o.id}',${i})">Quitar firma</button></div>`).join('')||'<p>Aún no hay firmas registradas.</p>'}`:''}${detailTab==='gastos'?`${button('+ Gasto en faena',`go('expenseform','${o.id}')`)}<p class="tiny">Registra combustible, peajes, alojamiento, alimentación, insumos y otros gastos no incluidos en los campos de traslado y viáticos para evitar duplicarlos.</p>${expenses.map((e,i)=>`<div class="item" style="margin-top:9px"><div class="row"><b>${esc(e.category)} · ${money(e.amount)}</b><button class="btn danger small" onclick="removeEmbedded('${o.id}','expenses',${i})">Quitar</button></div><small>${fmt(e.date)} · ${esc(e.description)}</small></div>`).join('')||'<p>No hay gastos adicionales.</p>'}`:''}${detailTab==='pagos'?`<div class="statline"><span>Traslado cotizado (neto)</span><strong>${money(billedTravel(o))}</strong></div><div class="statline"><span>Viáticos cotizados (neto)</span><strong>${money(billedPerDiem(o))}</strong></div><div class="statline"><span>Presupuesto (con impuestos)</span><strong>${money(total)}</strong></div><div class="statline"><span>Pagos recibidos</span><strong>${money(paid)}</strong></div><div class="statline"><span>Saldo pendiente</span><strong>${money(total-paid)}</strong></div><div class="statline"><span>Costos registrados</span><strong>${money(cost)}</strong></div><div class="statline"><span>Margen estimado antes de impuestos sobre la renta</span><strong>${money(net-cost)}</strong></div><p class="tiny">La utilidad requiere distinguir ventas netas, impuestos y costos efectivamente incurridos.</p>${button('+ Registrar abono',`go('paymentform','${o.id}')`)}${payments.map(p=>`<div class="item" style="margin-top:9px">${money(p.amount)} · ${esc(p.method)}<br><small>${fmt(p.date)} · ${esc(p.notes)}</small></div>`).join('')}`:''}${detailTab==='documentos'?`<p>Genera una vista imprimible y utiliza Compartir / Imprimir / Guardar PDF según tu dispositivo.</p><div class="tabs"><button onclick="openPrint('${o.id}','quote')">Cotización</button><button onclick="openPrint('${o.id}','report')">Informe técnico</button><button onclick="openPrint('${o.id}','parts')">Lista de repuestos</button><button onclick="openPrint('${o.id}','delivery')">Acta de entrega</button></div><p class="tiny">La cotización incluye mano de obra, repuestos, traslado y viáticos cotizados; los costos reales permanecen separados. Los documentos se generan localmente en el navegador. No se envían a un servidor.</p>`:''}</div>`}
async function partForm(){const o=await get('orders',detail),x=editPartIndex>=0?(o.parts||[])[editPartIndex]||{}:{};const sup=(await all('settings')).filter(v=>String(v.id).startsWith('supplier:')).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="topline"><h2>${editPartIndex>=0?'Editar':'Agregar'} repuesto</h2><button class="btn secondary small" onclick="go('order','${detail}')">Volver</button></div><form onsubmit="savePart(event)">${field('Repuesto / material *','name',x.name,'text','required')}${field('Código de pieza / N° de parte','code',x.code)}<label>Proveedor</label><input name="supplier" list="suppliersList" value="${esc(x.supplier||'')}" placeholder="Seleccionar o escribir proveedor"><datalist id="suppliersList">${sup.map(v=>`<option value="${esc(v.name)}">${esc(v.phone||'')}</option>`).join('')}</datalist><button type="button" class="btn secondary small" style="margin-top:8px" onclick="go('suppliers')">Administrar proveedores</button>${field('Cantidad *','qty',x.qty||1,'number','min="0.01" step="0.01" required')}<div class="two">${field('Costo unitario ($)','cost',x.cost||0,'number','min="0"')}${field('Precio venta unitario ($ neto)','sale',x.sale||0,'number','min="0"')}</div>${choose('Estado','status',['Por cotizar','Por comprar','Pedido','Recibido','Instalado','Devuelto'],x.status||'Por cotizar',true)}${field('Fecha de pedido','orderedAt',x.orderedAt,'date')}${field('Fecha estimada de llegada','eta',x.eta,'date')}${field('Fecha recepción','receivedAt',x.receivedAt,'date')}${field('N° orden de compra / seguimiento','tracking',x.tracking)}${field('N° factura / boleta del proveedor','invoice',x.invoice)}${area('Observaciones','notes',x.notes)}<button class="btn full">Guardar repuesto</button></form>`}
async function savePart(e){const d=dataForm(e),o=await get('orders',detail);if(!o){alert('Orden no encontrada');return}const arr=[...(o.parts||[])];if(editPartIndex>=0&&arr[editPartIndex])arr[editPartIndex]={...arr[editPartIndex],...d};else arr.push(d);o.parts=arr;o.updated=new Date().toISOString();await put('orders',o);const id=detail;go('order',id);detailTab='repuestos';render();toast('Repuesto guardado')}
async function expenseForm(){return `<div class="topline"><h2>Nuevo gasto en faena</h2><button class="btn secondary small" onclick="go('order','${detail}')">Volver</button></div><form onsubmit="saveExpense(event)">${field('Fecha','date',today(),'date')}${choose('Categoría','category',['Combustible','Peajes','Alojamiento','Alimentación','Compra menor','Herramientas','Otros'],'Otros',true)}${field('Monto ($) *','amount','','number','min="1" required')}${area('Descripción / comprobante','description')}<button class="btn full">Registrar gasto</button></form>`}
async function saveExpense(e){const d=dataForm(e),o=await get('orders',detail);if(!o)return;o.expenses=[...(o.expenses||[]),d];o.updated=new Date().toISOString();await put('orders',o);const id=detail;go('order',id);detailTab='gastos';render();toast('Gasto registrado')}

async function dayForm(){const o=await get('orders',detail),x=editDayIndex>=0?(o.workDays||[])[editDayIndex]||{}:{};return `<div class="topline"><h2>${editDayIndex>=0?'Editar jornada':'Nueva jornada de trabajo'}</h2><button class="btn secondary small" onclick="go('order','${detail}');detailTab='jornadas';render()">Volver</button></div><div class="notice">Agrega una jornada por cada día de servicio, aunque la reparación continúe pendiente. No necesitas finalizar la orden para guardar avances.</div><form onsubmit="saveDay(event)">${field('Fecha de trabajo *','date',x.date||today(),'date','required')}<div class="two">${field('Hora de inicio','startTime',x.startTime||'','time')}${field('Hora de término','endTime',x.endTime||'','time')}</div>${field('Horas efectivas de trabajo *','hours',x.hours??'0','number','min="0" max="24" step="0.25" required')}${choose('Tipo de jornada','kind',['Diagnóstico','Reparación','Mantención','Pruebas','Desplazamiento','Otro'],x.kind||'Reparación')}${area('Trabajos realizados en este día *','description',x.description||'')}<label>Observaciones o pendientes para la próxima visita</label><textarea name="pending">${esc(x.pending||'')}</textarea><button class="btn full">${editDayIndex>=0?'Guardar cambios':'Agregar día a la orden'}</button></form>`}
async function saveDay(e){const d=dataForm(e);if(!d.date||!d.description.trim()||!Number.isFinite(Number(d.hours))||Number(d.hours)<0||Number(d.hours)>24){alert('Indica una fecha, los trabajos realizados y horas válidas (0 a 24).');return}if(d.startTime&&d.endTime&&d.endTime<d.startTime){alert('La hora de término debe ser posterior a la de inicio. Para turnos que cruzan medianoche, registra las jornadas por fecha.');return}const o=await get('orders',detail);if(!o){alert('Orden no encontrada');return}const days=[...(o.workDays||[])];if(editDayIndex>=0&&days[editDayIndex])days[editDayIndex]={...days[editDayIndex],...d};else days.push({...d,id:uid()});o.workDays=days;o.updated=new Date().toISOString();await put('orders',o);const id=detail;go('order',id);detailTab='jornadas';render();toast('Jornada guardada')}
async function editDay(id,i){detail=id;editDayIndex=i;page='dayform';scrollTo(0,0);render()}
async function removeDay(id,i){if(!confirm('¿Eliminar esta jornada de la orden?'))return;const o=await get('orders',id);if(!o)return;o.workDays=(o.workDays||[]).filter((_,j)=>j!==i);o.updated=new Date().toISOString();await put('orders',o);detailTab='jornadas';render();toast('Jornada eliminada')}
function workDaySummary(o){const d=o.workDays||[];return {count:new Set(d.map(x=>x.date).filter(Boolean)).size,hours:d.reduce((n,x)=>n+(Number(x.hours)||0),0),first:d.map(x=>x.date).filter(Boolean).sort()[0]||o.date||'',last:d.map(x=>x.date).filter(Boolean).sort().at(-1)||''}}
async function activityForm(){return `<div class="topline"><h2>Trabajo realizado</h2><button class="btn secondary small" onclick="go('order','${detail}')">Volver</button></div><form onsubmit="saveEmbedded(event,'activities')">${field('Fecha','date',today(),'date')}${field('Horas dedicadas','hours',0,'number','min="0" step="0.25"')}${choose('Tipo de actividad','kind',['Diagnóstico','Reparación','Mantención','Pruebas','Desplazamiento','Otro'],'Reparación')}${area('Descripción técnica del trabajo *','description')}<button class="btn full">Registrar actividad</button></form>`}

irmación. Guarda primero un respaldo actualizado.</p></div><div class="panel"><h3>Actualización de la aplicación</h3><p class="mini">Si una versión antigua queda en pantalla, abre la dirección del sitio con conexión y vuelve a iniciar desde el ícono. Mantén el respaldo JSON. No borres datos del sitio para forzar la actualización.</p><button class="btn secondary full" onclick="checkUpdate()">Buscar actualización</button><p class="tiny" id="versionCheck"></p></div><div class="panel"><h3>Instalación en iPhone</h3><p class="mini">Publica la carpeta en un alojamiento HTTPS. Abre la dirección en Safari, toca Compartir y luego «Agregar a pantalla de inicio». Abre la aplicación una vez con internet para guardar sus recursos offline.</p><p class="tiny">En modo privado o al borrar datos de sitios web, la información local puede desaparecer. No uses esta aplicación como único registro de información crítica.</p></div><div class="panel"><h3>LP Service · Luis</h3><p class="mini">Prototipo funcional de un usuario. Sin autenticación real ni sincronización cloud. No emitir boletas ni facturas electrónicas desde esta versión.</p></div>`}
function dataForm(e){e.preventDefault();return Object.fromEntries(new FormData(e.target).entries())}
async function saveClient(e){const d=dataForm(e);d.id=detail||uid();d.updated=new Date().toISOString();await put('clients',d);toast('Cliente guardado');go('clients')}
async function saveMachine(e){const d=dataForm(e);if(d.type==='Otro'){d.type=String(d.typeCustom||'').trim();if(!d.type){alert('Especifica el tipo de equipo.');return}}delete d.typeCustom;delete d.iconOverride;d.id=detail&&!detail.startsWith('new:')?detail:uid();d.updated=new Date().toISOString();await put('machines',d);const ordersList=await all('orders');for(const order of ordersList.filter(o=>o.machineId===d.id)){order.machineLabel=[d.type,d.brand,d.model].filter(Boolean).join(' · ');order.machineType=d.type;order.machineIconOverride=d.iconOverride;await put('orders',order)}toast('Maquinaria guardada');go('clients')}
function syncQuotedCosts(form){if(!form)return;const auto=form.elements.namedItem('autoQuoteCosts')?.checked;for(const [quote,cost] of [['travelQuote','travelCost'],['perDiemQuote','perDiem']]){const out=form.elements.namedItem(quote),src=form.elements.namedItem(cost);if(!out||!src)continue;if(auto)out.value=src.value||'0';out.readOnly=!!auto;out.style.opacity=auto?'.75':'1'} }

function resizeImage(file,max=900,quality=.65){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));let cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*ratio);cv.height=Math.round(img.naturalHeight*ratio);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);resolve(cv.toDataURL('image/jpeg',quality))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagen inválida'))};img.src=url})}
async function savePhoto(e){e.preventDefault();try{const f=e.target.photo.files[0];if(!f||!f.type.startsWith('image/'))throw Error('Selecciona una imagen válida');if(f.size>25*1024*1024)throw Error('La imagen supera el límite de 25 MB. Reduce su tamaño.');const o=await get('orders',detail);if(!o)throw Error('Orden no encontrada');const d=dataForm(e);const rec={id:uid(),src:await resizeImage(f,1000,.68),label:d.label||'Durante',date:d.date||today(),workDayId:d.workDayId||'',description:d.description||'',created:new Date().toISOString()};o.photos=[...(o.photos||[]),rec];o.updated=new Date().toISOString();await put('orders',o);const id=detail;pendingPhotoDay='';go('order',id);detailTab='fotos';render();toast('Foto guardada en la jornada')}catch(err){if(err?.name==='QuotaExceededError')alert('Sin espacio en el dispositivo. Exporta el respaldo y libera espacio antes de continuar.');else alert(err.message)}}
async function removePhoto(id,i){if(!confirm('¿Eliminar definitivamente esta foto? Exporta un respaldo antes si quieres conservarla.'))return;const o=await get('orders',id);o.photos.splice(i,1);o.updated=new Date().toISOString();await put('orders',o);detailTab='fotos';render()}

async function signatureForm(){const o=await get('orders',detail);return `<div class="topline"><h2>Firma del cliente</h2><button class="btn secondary small" onclick="go('order','${detail}');detailTab='firmas';render()">Volver</button></div><div class="notice">Firma dibujada en pantalla para constancia de aprobación o recepción. No es una firma electrónica avanzada ni acredita por sí sola la identidad del firmante. Pide autorización antes de capturarla.</div><form onsubmit="saveSignature(event)">${choose('Documento que se firma','purpose',['Aprobación de cotización','Recepción conforme de maquinaria'],'Aprobación de cotización',true)}${field('Nombre de quien firma *','signer',o.contact||'','text','required')}${field('Cargo o relación con el cliente','role','')}${area('Observaciones de la firma','notes','')}<label>Firma con el dedo *</label><canvas id="signaturePad" class="signature-canvas" width="900" height="370" aria-label="Área para dibujar firma"></canvas><div class="row" style="margin-top:9px"><button class="btn secondary" type="button" onclick="clearSignaturePad()">Borrar y repetir firma</button><small>Traza tu firma dentro del recuadro.</small></div><label style="display:flex;gap:8px;align-items:flex-start"><input style="width:20px;flex:none" type="checkbox" name="consent" required><span>La persona acepta que se guarde la imagen de su firma asociada a esta orden.</span></label><button class="btn full" style="margin-top:12px">Guardar firma</button></form>`}
function initSignaturePad(){const c=document.getElementById('signaturePad');if(!c)return;const ctx=c.getContext('2d');ctx.lineWidth=4.5;ctx.strokeStyle='#111827';ctx.lineJoin='round';ctx.lineCap='round';let painting=false,moved=false;const loc=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};const down=e=>{e.preventDefault();painting=true;c.setPointerCapture?.(e.pointerId);const pt=loc(e);ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(pt.x+.1,pt.y+.1);ctx.stroke();moved=true};const move=e=>{if(!painting)return;e.preventDefault();const pt=loc(e);ctx.lineTo(pt.x,pt.y);ctx.stroke()};const up=e=>{painting=false};c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);signPad={canvas:c,ctx,hasInk:()=>moved,clear(){ctx.clearRect(0,0,c.width,c.height);moved=false}}}
function clearSignaturePad(){signPad?.clear()}
async function saveSignature(e){e.preventDefault();if(!signPad?.hasInk()){alert('Primero dibuja la firma en el recuadro.');return}const d=dataForm(e),o=await get('orders',detail);if(!o){alert('Orden no encontrada');return}const record={id:uid(),purpose:d.purpose,signer:String(d.signer||'').trim(),role:d.role||'',notes:d.notes||'',date:today(),created:new Date().toISOString(),image:signPad.canvas.toDataURL('image/png')};if(!record.signer){alert('Ingresa el nombre del firmante.');return}try{o.signatures=[...(o.signatures||[]),record];if(d.purpose==='Aprobación de cotización'){o.approvalStatus='Aprobado';o.approvalDate=today();o.approvalNotes=[o.approvalNotes||'',`Firma capturada: ${record.signer}`].filter(Boolean).join(' · ')}o.updated=new Date().toISOString();await put('orders',o);signPad=null;const id=detail;go('order',id);detailTab='firmas';render();toast('Firma guardada')}catch(err){alert('No se pudo guardar la firma: '+err.message)}}
async function removeSignature(id,i){if(!confirm('¿Eliminar esta firma? Esto no revierte automáticamente el estado de aprobación de la orden.'))return;const o=await get('orders',id);o.signatures.splice(i,1);o.updated=new Date().toISOString();await put('orders',o);detailTab='firmas';render()}
async function saveSettings(e){e.preventDefault();const d=dataForm(e),old=await get('settings','brand')||{};delete d.logo;d.id='brand';d.logo=old.logo||'';const f=e.target.logo.files?.[0];if(f)d.logo=await resizeImage(f,500,.7);await put('settings',d);toast('Configuración guardada');render()}
async function checkUpdate(){const label=document.querySelector('#versionCheck');try{const res=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('Sin respuesta del servidor');const v=await res.json();if(label)label.textContent='Versión publicada: '+v.version+'. Versión abierta: Alpha 19.';if(v.version!=='Alpha 19'&&confirm('Hay una versión distinta disponible. ¿Recargar?'))location.reload()}catch(e){if(label)label.textContent='Sin acceso a la versión publicada. Puedes seguir trabajando sin internet.'}}
async function exportBackup(){const payload={app:'LP Service',version:1,exported:new Date().toISOString(),data:{}};for(let s of STORES)payload.data[s]=await all(s);const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LP_Service_respaldo_${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Respaldo generado')}
async function importBackup(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!['HeavyMec','LP Service'].includes(data.app)||data.version!==1||!STORES.every(k=>Array.isArray(data.data?.[k])))throw Error('Formato de respaldo no válido');if(!confirm('Se reemplazarán TODOS los registros de este dispositivo. ¿Continuar?'))return;for(let s of STORES){await new Promise((resolve,reject)=>{const t=db.transaction(s,'readwrite'),os=t.objectStore(s);os.clear();data.data[s].forEach(x=>os.put(x));t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}toast('Respaldo restaurado');go('home')}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}}

const docCell = (v) => `<td>${esc(v??'')}</td>`;

function docEvidence(o){
  const photos=[...(o.photos||[])].filter(p=>p.src).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!photos.length)return '';
  const groups=new Map();for(const p of photos){const name=photoDayName(o,p);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(p)}
  return docSection(`Registro fotográfico (${photos.length})`,[...groups].map(([date,list])=>`<div class="lp-photo-group"><h4>${esc(date)}</h4><div class="lp-photo-grid">${list.map(p=>`<figure class="lp-photo"><img src="${p.src}" alt="Evidencia fotográfica"><figcaption><b>${esc(p.label||'Fotografía')}</b>${p.description?` — ${esc(p.description)}`:''}</figcaption></figure>`).join('')}</div></div>`).join(''));
}
function docSignatures(o,purpose){
  const sigs=(o.signatures||[]).filter(s=>s.purpose===purpose&&s.image);
  if(!sigs.length)return '<div class="lp-no-sign">Firma de conformidad: pendiente de registrar</div>';
  return `<div class="lp-signatures">${sigs.map(s=>`<div class="lp-sign-card"><img src="${s.image}" alt="Firma registrada"><b>${esc(s.signer||'Firmante')}</b><small>${esc(s.role||'')} · ${fmt(s.date)}</small>${s.notes?`<small>${esc(s.notes)}</small>`:''}</div>`).join('')}</div>`;
}
function docPartRows(parts,usedOnly=false){return (usedOnly?parts.filter(p=>p.status==='Instalado'):parts).map(p=>[p.code||p.partNumber||'—',p.name||'—',p.qty||0,p.status||'Sin estado'])}
async function openPrint(id,type){
  const o=await get('orders',id);if(!o){alert('No se encontró la orden');return}
  const brand=await get('settings','brand')||{},parts=o.parts||[],acts=o.activities||[],days=o.workDays||[];
  const payments=(await all('payments')).filter(p=>p.orderId===id);
  const totals={labor:Number(o.laborQuote)||0,other:Number(o.extraQuote)||0,travel:billedTravel(o),perDiem:billedPerDiem(o)};
  const materials=parts.reduce((v,p)=>v+(Number(p.qty)||0)*(Number(p.sale)||0),0);
  const net=totals.labor+totals.other+totals.travel+totals.perDiem+materials;
  const vat=o.iva===false?0:Math.round(net*.19);
  const paid=payments.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const titles={quote:'Cotización de servicio',report:'Informe técnico',parts:'Listado de repuestos',delivery:'Acta de entrega'};
  const key=titles[type]?type:'delivery',title=titles[key];
  const brandName=brand.name&&brand.name!=='HeavyMec'?brand.name:'LP Service';
  const masthead=`<div class="lp-doc-header"><div class="lp-doc-identity"><img src="${brand.logo||'logo_lp_completo.jpg'}" alt="Logo LP Service"><div><div class="lp-doc-brand">${esc(brandName)}</div><small>SERVICIO TÉCNICO · MAQUINARIA PESADA Y FORESTAL</small><div class="lp-doc-contacts">${[brand.rut,brand.phone,brand.email,brand.address].filter(Boolean).map(esc).join(' · ')}</div></div></div><div class="lp-doc-number"><b>${esc(title)}</b><span>${esc(o.number||'')}</span><small>Emisión: ${fmt(today())}</small></div></div>`;
  const details=`<div class="lp-doc-facts"><div><span>Cliente</span><strong>${esc(o.clientName||'Sin especificar')}</strong></div><div><span>Equipo</span><strong>${esc(o.machineLabel||'Sin especificar')}</strong></div><div><span>Horómetro</span><strong>${esc(o.hours??'—')} h</strong></div><div><span>Fecha del servicio</span><strong>${fmt(o.date)||'—'}</strong></div><div><span>Lugar o faena</span><strong>${esc(o.location||'—')}</strong></div><div><span>Estado de la OT</span><strong>${esc(o.status||'—')}</strong></div></div>`;
  let content='';
  if(key==='quote'){
    const quoted=[['Mano de obra','1',money(totals.labor)],...parts.map(p=>[p.name||'Repuesto',p.qty||0,money((Number(p.qty)||0)*(Number(p.sale)||0))]),['Traslado a faena','1',money(totals.travel)],['Viáticos','1',money(totals.perDiem)],['Otros cargos','1',money(totals.other)]];
    content=docSection('Alcance y diagnóstico',docText(o.diagnosis||o.problem))+
      docSection('Detalle de la oferta económica',docTable(['Concepto','Cantidad','Total neto'],quoted))+
      `<section class="lp-doc-totals"><div><span>Neto</span><b>${money(net)}</b></div><div><span>IVA ${o.iva===false?'(no aplicado)':'(19%)'}</span><b>${money(vat)}</b></div><div class="lp-doc-total"><span>TOTAL</span><b>${money(net+vat)}</b></div></section>`+
      docSection('Estado de aprobación',`<p><b>${esc(o.approvalStatus||'Pendiente')}</b>${o.approvalDate?' · '+fmt(o.approvalDate):''}</p>`+docSignatures(o,'Aprobación de cotización'))+
      `<p class="lp-doc-legal">Valores y alcance sujetos a las condiciones informadas y aceptadas por el cliente. No constituye documento tributario.</p>`;
  }else if(key==='report'){
    const done=String(o.workDoneList||'').split('\n').map(x=>x.trim()).filter(Boolean);
    content=docSection('Falla reportada',docText(o.problem))+
      docSection('Diagnóstico técnico',docText(o.diagnosis))+
      docSection('Trabajos realizados',done.length?`<ol class="lp-doc-ordered">${done.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:docText('Sin listado general registrado'))+
      (days.length?docSection(`Jornadas registradas (${workDaySummary(o).count} días / ${workDaySummary(o).hours.toLocaleString('es-CL')} h)`,[...days].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(d=>`<div class="lp-doc-day"><b>${fmt(d.date)} · ${esc(d.kind||'Trabajo')} · ${esc(d.hours||0)} h</b><p>${esc(d.description||'Sin descripción')}</p>${d.pending?`<small>Pendientes: ${esc(d.pending)}</small>`:''}</div>`).join('')):'')+
      (acts.length?docSection('Actividades adicionales',acts.map(a=>`<p class="lp-doc-activity"><b>${fmt(a.date)} · ${esc(a.hours||0)} h</b> — ${esc(a.description||'')} (${esc(a.kind||'Trabajo')})</p>`).join('')):'')+
      docSection('Repuestos instalados',docTable(['Código','Repuesto','Cantidad','Estado'],docPartRows(parts,true),'Sin repuestos marcados como instalados'))+
      docSection('Observaciones y recomendaciones',docText(o.notes))+
      docEvidence(o)+docSection('Recepción conforme',docSignatures(o,'Recepción conforme de maquinaria'));
  }else if(key==='parts'){
    content=docSection('Repuestos asociados a la orden',docTable(['Código','Repuesto','Cantidad','Estado'],docPartRows(parts),'Sin repuestos registrados'));
  }else{
    content=docSection('Antecedentes de entrega',`<p>Se hace entrega del equipo indicado, asociado a la orden <b>${esc(o.number)}</b>.</p>`)+
      docSection('Resumen del servicio',docText(o.diagnosis||o.title))+
      docSection('Recomendaciones',docText(o.notes))+
      docSection('Control de pagos',`<div class="lp-doc-facts"><div><span>Pagos recibidos</span><strong>${money(paid)}</strong></div><div><span>Saldo estimado</span><strong>${money(Math.max(0,net+vat-paid))}</strong></div></div>`)+
      docSection('Firma de recepción',docSignatures(o,'Recepción conforme de maquinaria'));
  }
  const footer=`<footer class="lp-doc-footer"><span>${esc(brand.owner||'Responsable técnico')} · ${esc(brandName)}</span><span>OT ${esc(o.number||'')}</span></footer>`;
  document.getElementById('documentPaper').innerHTML=`<div class="lp-doc">${masthead}${details}${content}${footer}</div>`;
  document.getElementById('documentPreview').classList.add('open');
  document.body.style.overflow='hidden';document.getElementById('documentPreview').scrollTop=0;
  if(!location.hash.includes('documento'))history.pushState({lpDocument:true},'','#documento');
}

function closeDocument(){const el=document.getElementById('documentPreview');if(el){el.classList.remove('open');document.body.style.overflow='';}}
window.addEventListener('popstate',()=>{if(document.getElementById('documentPreview')?.classList.contains('open'))closeDocument()});
(async()=>{try{db=await openDB();if(!(await get('settings','brand')))await put('settings',{id:'brand',name:'LP Service',owner:'Luis',email:'pinaud.luis@gmail.com',logo:''});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);syncBadge();render();}catch(e){document.querySelector('#app').innerHTML='<div class="notice">No fue posible abrir la base de datos local. Usa Safari o un navegador actualizado, fuera del modo privado. '+esc(e.message)+'</div>'}})();

// Alpha 19: Agenda de visitas y mantenciones. Los registros viven en la tienda
// "settings", que ya está incluida en respaldos v1 de Alpha 19 y anteriores.
const agendaKey=id=>String(id||'').startsWith('agenda:')?String(id):'agenda:'+id;
const agendaRecords=async()=>(await all('settings')).filter(x=>String(x.id||'').startsWith('agenda:'));
const agendaCategories=['Visita técnica','Diagnóstico','Reparación','Mantención preventiva','Inspección','Otro'];
const agendaDone=x=>x.status==='Realizado'||x.status==='Cancelado';
function agendaStatus(x,machine){
 if(agendaDone(x))return x.status;
 const d=today(), h=Number(machine?.hours||0), limit=Number(x.dueHours||0);
 const byDate=!!x.dueDate&&x.dueDate<d;
 const byHour=limit>0&&h>=limit;
 if(byDate||byHour)return 'Vencido';
 const lead=Math.max(0,Number(x.noticeDays??7));
 const threshold=new Date();threshold.setDate(threshold.getDate()+lead);
 const iso=[threshold.getFullYear(),String(threshold.getMonth()+1).padStart(2,'0'),String(threshold.getDate()).padStart(2,'0')].join('-');
 const nextByDate=!!x.dueDate&&x.dueDate<=iso;
 const nextByHour=limit>0&&h>=limit-Math.max(0,Number(x.noticeHours??50));
 return nextByDate||nextByHour?'Próximo':'Programado';
}
function agendaMachineName(machine){return machine?[machine.type,machine.brand,machine.model].filter(Boolean).join(' · '):'Sin equipo vinculado'}
function agendaLabel(x){return x.title||x.category||'Servicio programado'}
async function agendaPage(){
 const [events,machines,orders,clients]=await Promise.all([agendaRecords(),all('machines'),all('orders'),all('clients')]);
 const mm=new Map(machines.map(x=>[x.id,x])),oo=new Map(orders.map(x=>[x.id,x])),cc=new Map(clients.map(x=>[x.id,x]));
 const counts={Vencido:0,Próximo:0,Programado:0};
 events.forEach(x=>{const s=agendaStatus(x,mm.get(x.machineId));if(counts[s]!==undefined)counts[s]++});
 const sorted=events.sort((a,b)=> (agendaDone(a)?1:0)-(agendaDone(b)?1:0) || (a.dueDate||'9999-12-31').localeCompare(b.dueDate||'9999-12-31'));
 return `<div class="topline"><div><h2>Agenda y mantenciones</h2><small>Visitas y planes preventivos</small></div><button class="btn" onclick="go('agendaitem')">+ Agendar</button></div>
 <div class="notice">Alertas locales al abrir LP Service. No se envían notificaciones automáticas si la app está cerrada. Para mantenciones por horómetro, actualiza las horas de la máquina.</div>
 <div class="kpis"><div class="kpi"><small>Vencidas</small><b>${counts.Vencido}</b></div><div class="kpi"><small>Próximas</small><b>${counts.Próximo}</b></div><div class="kpi"><small>Programadas</small><b>${counts.Programado}</b></div></div>
 ${sorted.map(x=>{const machine=mm.get(x.machineId),stat=agendaStatus(x,machine),order=oo.get(x.orderId),cl=cc.get(x.clientId||machine?.clientId);return `<div class="item agenda-item"><div class="row wrap"><b>${esc(agendaLabel(x))}</b><span class="pill ${stat==='Vencido'?'bad':stat==='Próximo'?'warning':stat==='Realizado'?'good':''}">${esc(stat)}</span></div><div class="meta">${esc(x.category||'Servicio')} · ${esc(cl?.name||'Cliente no vinculado')}<br>${esc(agendaMachineName(machine))}</div><div class="meta">${x.dueDate?'📅 '+fmt(x.dueDate):'Sin fecha límite'}${x.time?' · '+esc(x.time):''}${Number(x.dueHours)>0?' · ⏱ '+esc(x.dueHours)+' h':''}</div>${x.location?`<div class="meta">📍 ${esc(x.location)}</div>`:''}${order?`<div class="meta">Orden: ${esc(order.number)}</div>`:''}${x.notes?`<p class="mini">${esc(x.notes)}</p>`:''}<div class="row wrap"><button class="btn secondary small" onclick="go('agendaitem','${esc(x.id)}')">Editar</button>${!agendaDone(x)?`<button class="btn small" onclick="completeAgenda('${esc(x.id)}')">Marcar realizado</button>`:''}${order?`<button class="btn secondary small" onclick="go('order','${esc(order.id)}')">Ver OT</button>`:''}<button class="btn danger small" onclick="deleteAgenda('${esc(x.id)}')">Eliminar</button></div></div>`}).join('')||'<div class="empty">Sin visitas o mantenciones programadas. Pulsa «+ Agendar» para comenzar.</div>'}`;
}
async function agendaForm(){
 const x=detail?await get('settings',agendaKey(detail))||{}:{};
 const [machines,orders,clients]=await Promise.all([all('machines'),all('orders'),all('clients')]);
 const clientOptions=clients.map(c=>({id:c.id,name:c.name}));
 const machineOptions=machines.map(m=>({id:m.id,name:agendaMachineName(m)+' · '+(m.serial||'Sin serie')}));
 const orderOptions=orders.map(o=>({id:o.id,name:o.number+' · '+(o.title||'Servicio')}));
 return `<div class="topline"><h2>${x.id?'Editar':'Nueva'} programación</h2><button class="btn secondary small" onclick="go('agenda')">Volver</button></div>
 <form onsubmit="saveAgenda(event)">${field('Título / servicio *','title',x.title||'','text','required placeholder="Mantención de sistema hidráulico"')}${choose('Tipo de servicio','category',agendaCategories,x.category||'Mantención preventiva',true)}${choose('Cliente','clientId',clientOptions,x.clientId||'')}${choose('Maquinaria o vehículo','machineId',machineOptions,x.machineId||'')}${choose('Orden de trabajo vinculada (opcional)','orderId',orderOptions,x.orderId||'')}
 <div class="two">${field('Fecha programada o vencimiento','dueDate',x.dueDate||'','date')}${field('Hora de visita','time',x.time||'','time')}</div><div class="two">${field('Horómetro objetivo (h)','dueHours',x.dueHours||'','number','min="0" step="0.1"')}${field('Avisar con días de anticipación','noticeDays',x.noticeDays??7,'number','min="0" max="365"')}</div>${field('Avisar con horas de anticipación','noticeHours',x.noticeHours??50,'number','min="0" step="1"')}${field('Lugar / faena','location',x.location||'')}${area('Trabajos previstos / recomendaciones','notes',x.notes||'')}${choose('Estado','status',['Pendiente','Realizado','Cancelado'],x.status||'Pendiente',true)}<div class="notice">Puedes definir fecha, horómetro o ambos. Si se cumplen ambos criterios, la programación vencerá cuando se alcance el primero.</div><button class="btn full">Guardar programación</button></form>`;
}
async function saveAgenda(e){const d=dataForm(e);if(!String(d.title||'').trim()){alert('Ingresa el servicio');return}if(!d.dueDate&&!(Number(d.dueHours)>0)){alert('Ingresa una fecha o un horómetro objetivo');return}
 const old=detail?await get('settings',agendaKey(detail)):null;
 const data={...(old||{}),...d,id:old?.id||agendaKey(uid()),created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};
 await put('settings',data);go('agenda');toast('Programación guardada');}
async function completeAgenda(id){const old=await get('settings',agendaKey(id));if(!old)return; if(!confirm('¿Marcar este servicio como realizado?'))return;old.status='Realizado';old.completedAt=new Date().toISOString();await put('settings',old);render();toast('Servicio completado')}
async function deleteAgenda(id){if(!confirm('¿Eliminar esta programación?'))return;await del('settings',agendaKey(id));render();toast('Programación eliminada')}
</script></body></html>
